version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./shared:/app/shared
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  scanner:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./shared:/app/shared
    command: python scrapers/scheduler.py
    restart: unless-stopped
    depends_on:
      - api

  clv-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./shared:/app/shared
    command: >
      sh -c "while true; do python scrapers/clv_tracker.py; sleep 300; done"
    restart: unless-stopped
    depends_on:
      - api
