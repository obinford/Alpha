<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTM Picks — Daily Recap</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{
    background:#0a0e17;color:#c8cdd6;
    font-family:'SF Mono','Fira Code','Cascadia Code',Consolas,monospace;
    font-size:13px;line-height:1.5;
  }
  a{color:#42a5f5;text-decoration:none}
  a:hover{text-decoration:underline}
  .container{max-width:1400px;margin:0 auto;padding:16px 24px}

  /* Nav */
  nav{
    display:flex;gap:24px;padding:8px 0;border-bottom:1px solid #1a2035;margin-bottom:16px;
    font-size:12px;text-transform:uppercase;letter-spacing:1.5px;
  }
  nav a{color:#5a6378;padding:4px 0;border-bottom:2px solid transparent}
  nav a:hover{color:#c8cdd6;text-decoration:none}
  nav a.active{color:#00e676;border-bottom-color:#00e676}

  /* Header */
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 0;border-bottom:1px solid #1a2035;margin-bottom:16px;
  }
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand h1{font-size:20px;font-weight:700;color:#e1e5eb;letter-spacing:1px}
  .brand h1 span{color:#00e676}
  .brand .tagline{font-size:11px;color:#5a6378;text-transform:uppercase;letter-spacing:2px}
  .status-bar{display:flex;align-items:center;gap:16px;font-size:11px;color:#5a6378}
  .status-bar .dot{
    width:7px;height:7px;border-radius:50%;display:inline-block;
    background:#00e676;box-shadow:0 0 6px #00e67680;
  }
  .status-bar .dot.error{background:#ff5252;box-shadow:0 0 6px #ff525280}

  /* Date nav */
  .date-nav{
    display:flex;align-items:center;gap:16px;margin-bottom:20px;
    justify-content:center;
  }
  .date-nav button{
    background:#111827;border:1px solid #1a2035;border-radius:4px;
    color:#c8cdd6;padding:6px 14px;font-family:inherit;font-size:12px;
    cursor:pointer;
  }
  .date-nav button:hover{background:#1a2035;border-color:#42a5f5}
  .date-nav .current-date{
    font-size:18px;font-weight:700;color:#e1e5eb;min-width:180px;text-align:center;
  }

  /* Recap card */
  .recap-card{
    background:#111827;border:1px solid #1a2035;border-radius:8px;
    padding:24px;margin-bottom:20px;
  }
  .recap-header{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #1a2035;
  }
  .recap-title{font-size:16px;font-weight:700;color:#e1e5eb}
  .recap-pnl{font-size:24px;font-weight:700}
  .recap-pnl.positive{color:#00e676}
  .recap-pnl.negative{color:#ff5252}
  .recap-pnl.zero{color:#5a6378}

  /* Stats grid */
  .stats-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
    gap:16px;margin-bottom:20px;
  }
  .stat-item{
    background:#0d1420;border:1px solid #131b2e;border-radius:6px;padding:12px;
  }
  .stat-label{font-size:10px;color:#5a6378;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
  .stat-value{font-size:18px;font-weight:700;color:#e1e5eb}
  .stat-value.green{color:#00e676}
  .stat-value.red{color:#ff5252}
  .stat-value.yellow{color:#ffc107}

  /* Sport breakdown */
  .sport-breakdown{margin-bottom:20px}
  .sport-breakdown h3{font-size:14px;color:#e1e5eb;font-weight:600;margin-bottom:12px}
  .sport-row{
    display:flex;align-items:center;gap:16px;padding:8px 12px;
    border-bottom:1px solid #131b2e;
  }
  .sport-row:last-child{border-bottom:none}
  .sport-row:hover{background:#151e30}
  .sport-badge{
    display:inline-block;padding:2px 8px;border-radius:3px;
    font-size:10px;font-weight:700;text-transform:uppercase;min-width:36px;text-align:center;
  }
  .sport-mlb{background:#4caf5020;color:#4caf50;border:1px solid #4caf5040}
  .sport-nba{background:#5c6bc020;color:#5c6bc0;border:1px solid #5c6bc040}
  .sport-nfl{background:#a1887f20;color:#a1887f;border:1px solid #a1887f40}
  .sport-nhl{background:#4dd0e120;color:#4dd0e1;border:1px solid #4dd0e140}
  .sport-cfb{background:#ffb74d20;color:#ffb74d;border:1px solid #ffb74d40}
  .sport-cbb{background:#ba68c820;color:#ba68c8;border:1px solid #ba68c840}
  .sport-default{background:#8892a420;color:#8892a4;border:1px solid #8892a440}

  /* Results table */
  .results-section{margin-top:20px}
  .results-section h3{font-size:14px;color:#e1e5eb;font-weight:600;margin-bottom:12px}
  table{width:100%;border-collapse:collapse}
  th{
    text-align:left;padding:8px 14px;font-size:11px;color:#5a6378;
    text-transform:uppercase;letter-spacing:1px;font-weight:600;
    border-bottom:1px solid #1a2035;background:#0d1420;
  }
  td{padding:8px 14px;border-bottom:1px solid #131b2e}
  tr:hover{background:#151e30}

  .result-win{color:#00e676;font-weight:700}
  .result-loss{color:#ff5252;font-weight:700}
  .result-push{color:#5a6378;font-weight:700}
  .pnl-pos{color:#00e676;font-weight:700}
  .pnl-neg{color:#ff5252;font-weight:700}

  /* All-time banner */
  .alltime-banner{
    background:#0d1420;border:1px solid #1a2035;border-radius:6px;
    padding:16px;display:flex;gap:32px;align-items:center;justify-content:center;
    margin-bottom:20px;
  }
  .alltime-banner .at-label{font-size:10px;color:#5a6378;text-transform:uppercase;letter-spacing:1px}
  .alltime-banner .at-value{font-size:16px;font-weight:700;color:#e1e5eb}

  /* Empty state */
  .message{text-align:center;padding:40px 20px;color:#5a6378}
  .message.error{color:#ff5252}
  .spinner{
    width:28px;height:28px;border:3px solid #1a2035;border-top-color:#00e676;
    border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  @media(max-width:900px){
    .container{padding:10px 12px}
    .stats-grid{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>
<div class="container">
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="sharp-tracker.html">Sharp Tracker</a>
    <a href="props.html">Props</a>
    <a href="odds-screen.html">Odds Screen</a>
    <a href="performance.html">Performance</a>
    <a href="clv-report.html">CLV Report</a>
    <a href="daily-recap.html" class="active">Daily Recap</a>
    <a href="bankroll.html">Bankroll</a>
  </nav>

  <header>
    <div class="brand">
      <h1>RTM <span>PICKS</span></h1>
      <span class="tagline">Daily Recap</span>
    </div>
    <div class="status-bar">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">Loading...</span>
    </div>
  </header>

  <!-- Date navigator -->
  <div class="date-nav">
    <button onclick="navigate(-1)">&larr; Previous Day</button>
    <div class="current-date" id="current-date">—</div>
    <button onclick="navigate(1)">Next Day &rarr;</button>
    <button onclick="goToday()" style="margin-left:12px">Today</button>
  </div>

  <!-- All-time banner -->
  <div class="alltime-banner" id="alltime-banner" style="display:none">
    <div><div class="at-label">All-Time Record</div><div class="at-value" id="at-record">—</div></div>
    <div><div class="at-label">All-Time Units</div><div class="at-value" id="at-units">—</div></div>
    <div><div class="at-label">All-Time ROI</div><div class="at-value" id="at-roi">—</div></div>
  </div>

  <!-- Recap content -->
  <div id="recap-content">
    <div class="message"><div class="spinner"></div>Loading daily recap...</div>
  </div>
</div>

<script>
const API = window.location.origin + "/api";
let currentDate = new Date();
// Default to yesterday.
currentDate.setDate(currentDate.getDate() - 1);

function sportKey(s) {
  s = (s || "").toLowerCase();
  if (s.includes("mlb") || s.includes("baseball")) return "mlb";
  if (s.includes("nba") || s.includes("basketball_n")) return "nba";
  if (s.includes("nfl") || s.includes("football_nfl")) return "nfl";
  if (s.includes("nhl") || s.includes("hockey")) return "nhl";
  if (s.includes("ncaaf") || s.includes("football_ncaa")) return "cfb";
  if (s.includes("ncaab") || s.includes("basketball_ncaa")) return "cbb";
  return "default";
}

function sportLabel(raw) {
  const map = {mlb:"MLB",nba:"NBA",nfl:"NFL",nhl:"NHL",cfb:"CFB",cbb:"CBB"};
  return map[sportKey(raw)] || raw || "\u2014";
}

function fmtOdds(v) {
  const n = Number(v);
  if (isNaN(n)) return String(v);
  return n > 0 ? "+" + n : String(n);
}

function fmtUnits(v) {
  const n = Number(v);
  if (isNaN(n)) return "\u2014";
  return (n > 0 ? "+" : "") + n.toFixed(2) + "u";
}

function dateStr(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

function displayDate(d) {
  return d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" });
}

function setStatus(ok, text) {
  document.getElementById("status-dot").className = ok ? "dot" : "dot error";
  document.getElementById("status-text").textContent = text;
}

function navigate(delta) {
  currentDate.setDate(currentDate.getDate() + delta);
  fetchRecap();
}

function goToday() {
  currentDate = new Date();
  fetchRecap();
}

function renderRecap(recap) {
  const container = document.getElementById("recap-content");
  document.getElementById("current-date").textContent = displayDate(currentDate);

  // All-time banner.
  const banner = document.getElementById("alltime-banner");
  banner.style.display = "flex";
  document.getElementById("at-record").textContent = recap.alltime_record || "\u2014";
  const atUnits = Number(recap.alltime_units) || 0;
  const atUnitsEl = document.getElementById("at-units");
  atUnitsEl.textContent = fmtUnits(atUnits);
  atUnitsEl.style.color = atUnits >= 0 ? "#00e676" : "#ff5252";
  const atRoi = Number(recap.alltime_roi) || 0;
  const atRoiEl = document.getElementById("at-roi");
  atRoiEl.textContent = (atRoi >= 0 ? "+" : "") + atRoi.toFixed(1) + "%";
  atRoiEl.style.color = atRoi >= 0 ? "#00e676" : "#ff5252";

  if (!recap.total_bets) {
    container.innerHTML = '<div class="message">No graded bets for this date. Games may not have finished yet, or no picks were placed.</div>';
    return;
  }

  const units = Number(recap.units) || 0;
  const roi = Number(recap.roi) || 0;
  const pnlClass = units > 0 ? "positive" : units < 0 ? "negative" : "zero";

  let html = `
  <div class="recap-card">
    <div class="recap-header">
      <div class="recap-title">${recap.date || dateStr(currentDate)}</div>
      <div class="recap-pnl ${pnlClass}">${fmtUnits(units)}</div>
    </div>

    <div class="stats-grid">
      <div class="stat-item">
        <div class="stat-label">Record</div>
        <div class="stat-value">${recap.record || "\u2014"}</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Units</div>
        <div class="stat-value ${units >= 0 ? 'green' : 'red'}">${fmtUnits(units)}</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">ROI</div>
        <div class="stat-value ${roi >= 0 ? 'green' : 'red'}">${(roi >= 0 ? "+" : "") + roi.toFixed(1)}%</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Total Bets</div>
        <div class="stat-value">${recap.total_bets}</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Avg CLV</div>
        <div class="stat-value yellow">${recap.avg_clv != null ? (Number(recap.avg_clv) >= 0 ? "+" : "") + Number(recap.avg_clv).toFixed(2) + "%" : "\u2014"}</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Steam Alerts</div>
        <div class="stat-value">${recap.steam_alerts || 0}</div>
      </div>
    </div>

    <div class="stats-grid" style="grid-template-columns:1fr 1fr">
      <div class="stat-item">
        <div class="stat-label">Best Bet</div>
        <div class="stat-value green" style="font-size:13px">${recap.best_bet || "\u2014"}</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Worst Bet</div>
        <div class="stat-value red" style="font-size:13px">${recap.worst_bet || "\u2014"}</div>
      </div>
    </div>`;

  // Sport breakdown.
  const bySport = recap.by_sport || {};
  if (Object.keys(bySport).length > 0) {
    html += '<div class="sport-breakdown"><h3>By Sport</h3>';
    Object.entries(bySport).sort((a, b) => (b[1].units || 0) - (a[1].units || 0)).forEach(([sport, stats]) => {
      const sk = sportKey(sport);
      const u = Number(stats.units) || 0;
      html += `<div class="sport-row">
        <span class="sport-badge sport-${sk}">${sportLabel(sport)}</span>
        <span style="color:#e1e5eb;font-weight:600;min-width:60px">${stats.record || "\u2014"}</span>
        <span style="color:${u >= 0 ? '#00e676' : '#ff5252'};font-weight:700">${fmtUnits(u)}</span>
      </div>`;
    });
    html += '</div>';
  }

  // Results table.
  const results = recap.results || [];
  if (results.length > 0) {
    html += '<div class="results-section"><h3>Individual Results</h3><table><thead><tr>';
    html += '<th>Sport</th><th>Game</th><th>Pick</th><th>Odds</th><th>EV%</th><th>Result</th><th>P/L</th>';
    html += '</tr></thead><tbody>';
    results.forEach(r => {
      const sk = sportKey(r.sport);
      const res = (r.result || "").toUpperCase();
      let resClass = "result-push";
      if (res === "WIN") resClass = "result-win";
      else if (res === "LOSS") resClass = "result-loss";
      const pnl = Number(r.pnl) || 0;
      html += `<tr>
        <td><span class="sport-badge sport-${sk}">${sportLabel(r.sport)}</span></td>
        <td>${r.game || "\u2014"}</td>
        <td style="color:#e1e5eb">${r.pick || "\u2014"}</td>
        <td>${fmtOdds(r.odds)}</td>
        <td style="color:#ffc107">${r.ev_pct != null ? Number(r.ev_pct).toFixed(1) + "%" : "\u2014"}</td>
        <td class="${resClass}">${res || "\u2014"}</td>
        <td class="${pnl > 0 ? 'pnl-pos' : pnl < 0 ? 'pnl-neg' : ''}">${fmtUnits(pnl)}</td>
      </tr>`;
    });
    html += '</tbody></table></div>';
  }

  html += '</div>';
  container.innerHTML = html;
}

async function fetchRecap() {
  const ds = dateStr(currentDate);
  document.getElementById("current-date").textContent = displayDate(currentDate);
  document.getElementById("recap-content").innerHTML = '<div class="message"><div class="spinner"></div>Loading recap...</div>';

  try {
    const res = await fetch(API + "/recap/date/" + ds);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    renderRecap(data);
    setStatus(true, "Loaded");
  } catch (e) {
    setStatus(false, "Error: " + e.message);
    document.getElementById("recap-content").innerHTML =
      '<div class="message error">Failed to load recap. Is the API running?</div>';
  }
}

fetchRecap();
</script>
</body>
</html>
