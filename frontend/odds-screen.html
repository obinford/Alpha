<style>

  }

  /* Help tooltip */

<script>
const API = window.location.origin + '/api';
const REFRESH = 120;
const SHARP_BOOKS = new Set(['pinnacle','circa','betonlineag']);
const SHARP_PRIORITY = ['pinnacle','circa','betonlineag'];

let countdown = REFRESH;
let timerInterval;
let currentFormat = 'american';
let currentData = null;
let edgeOpen = false;

/* ===== Math utilities ===== */

function americanToImplied(odds) {
  const n = Number(odds);
  if (isNaN(n) || n === 0) return 0;
  return n > 0 ? 100 / (n + 100) : Math.abs(n) / (Math.abs(n) + 100);
}

function americanToDecimal(odds) {
  const n = Number(odds);
  if (isNaN(n) || n === 0) return 0;
  return n > 0 ? n / 100 + 1 : 100 / Math.abs(n) + 1;
}

function impliedToAmerican(prob) {
  if (prob <= 0 || prob >= 1) return 0;
  return prob >= 0.5
    ? Math.round(-prob / (1 - prob) * 100)
    : Math.round((1 - prob) / prob * 100);
}

function calculateVig(outcomes) {
  let total = 0;
  for (const o of outcomes) total += americanToImplied(o.odds);
  return (total - 1) * 100;
}

function devigOutcomes(outcomes) {
  const imp = outcomes.map(o => americanToImplied(o.odds));
  const sum = imp.reduce((a, b) => a + b, 0);
  return sum > 0 ? imp.map(p => p / sum) : imp;
}

function calculateEV(trueProb, odds) {
  const dec = americanToDecimal(odds);
  return dec > 0 ? (trueProb * dec - 1) * 100 : 0;
}

/* ===== Format display ===== */

function fmtOdds(v) {
  const n = Number(v);
  if (isNaN(n)) return '\u2014';
  return n > 0 ? '+' + n : String(n);
}

function fmtDec(v) {
  const d = americanToDecimal(v);
  return d > 0 ? d.toFixed(2) : '\u2014';
}

function fmtProb(v) {
  const p = americanToImplied(v);
  return p > 0 ? (p * 100).toFixed(1) + '%' : '\u2014';
}

function fmtByFmt(odds, fmt) {
  if (fmt === 'decimal') return fmtDec(odds);
  if (fmt === 'implied') return fmtProb(odds);
  return fmtOdds(odds);
}

function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return d.toLocaleString('en-US', { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
}

function hoursUntil(ts) {
  if (!ts) return null;
  const d = new Date(ts);
  return isNaN(d) ? null : (d - Date.now()) / 3600000;
}

function timeBadge(ts) {
  const h = hoursUntil(ts);
  if (h === null) return '';
  if (h < 0) return '<span class="time-badge badge-live">LIVE</span>';
  if (h < 2) return `<span class="time-badge badge-soon">${h < 1 ? Math.round(h*60)+'m' : h.toFixed(1)+'h'}</span>`;
  if (h >= 24) return `<span class="time-badge badge-early">${Math.round(h)}h out</span>`;
  return '';
}

function dateGroup(ts) {
  if (!ts) return 'UNKNOWN';
  const d = new Date(ts);
  if (isNaN(d)) return 'UNKNOWN';
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const gDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diff = (gDay - today) / 86400000;
  if (diff < 0) return 'LIVE / IN PROGRESS';
  if (diff < 1) return 'TODAY';
  if (diff < 2) return 'TOMORROW';
  return d.toLocaleDateString('en-US', { weekday:'long', month:'short', day:'numeric' }).toUpperCase();
}

/* ===== Game analysis ===== */

function analyzeGame(game, books, market) {
  const bookOdds = game.book_odds || {};

  // Determine sides for this market.
  let sideKeys = [];
  if (market === 'h2h') {
    sideKeys = [game.away_team, game.home_team];
    for (const bk in bookOdds) {
      if (bookOdds[bk]['Draw']) { sideKeys.push('Draw'); break; }
    }
  } else if (market === 'spreads') {
    sideKeys = [game.away_team, game.home_team];
  } else if (market === 'totals') {
    sideKeys = ['Over', 'Under'];
  }

  // Vig per book.
  const bookVigs = {};
  for (const bk of books) {
    const d = bookOdds[bk.key];
    if (!d) continue;
    const oc = sideKeys.filter(s => d[s]).map(s => ({ odds: d[s].odds }));
    if (oc.length >= 2) bookVigs[bk.key] = calculateVig(oc);
  }

  // Sharp true line from best available sharp book.
  let sharpBook = null;
  let trueLine = null;
  for (const sk of SHARP_PRIORITY) {
    const d = bookOdds[sk];
    if (!d) continue;
    const oc = sideKeys.filter(s => d[s]).map(s => ({ odds: d[s].odds, side: s }));
    if (oc.length >= 2) {
      sharpBook = sk;
      const tp = devigOutcomes(oc);
      trueLine = {};
      oc.forEach((o, i) => { trueLine[o.side] = tp[i]; });
      break;
    }
  }

  // Find +EV edges.
  const edges = [];
  if (trueLine) {
    for (const bk of books) {
      if (SHARP_BOOKS.has(bk.key)) continue;
      const d = bookOdds[bk.key];
      if (!d) continue;
      for (const side of sideKeys) {
        const sd = d[side];
        if (!sd) continue;
        const tp = trueLine[side];
        if (!tp) continue;
        const ev = calculateEV(tp, sd.odds);
        if (ev > 0) {
          edges.push({
            game: game.away_team + ' @ ' + game.home_team,
            side, book: bk.title, bookKey: bk.key,
            odds: sd.odds, point: sd.point,
            trueProb: tp, ev,
            commence: game.commence_time,
          });
        }
      }
    }
  }

  return {
    sideKeys, bookVigs, trueLine, sharpBook, edges,
    bestEdge: edges.length ? Math.max(...edges.map(e => e.ev)) : 0,
    sharpVig: sharpBook && bookVigs[sharpBook] != null ? bookVigs[sharpBook] : 99,
  };
}

/* ===== Status ===== */

function setStatus(ok, text) {
  document.getElementById('status-dot').className = ok ? 'dot' : 'dot error';
  document.getElementById('status-text').textContent = text;
}

/* ===== Rendering ===== */

function renderAll() {
  if (!currentData) return;
  const data = currentData;
  const books = data.books || [];
  const market = data.market || 'h2h';
  const search = document.getElementById('search-input').value.trim().toLowerCase();
  const sortBy = document.getElementById('sort-by').value;

  let games = [...(data.games || [])];

  // Search filter.
  if (search) {
    games = games.filter(g =>
      g.home_team.toLowerCase().includes(search) ||
      g.away_team.toLowerCase().includes(search)
    );
  }

  // Analyze every game.
  const analyses = new Map();
  const allEdges = [];
  const allBookVigs = {};

  for (const g of games) {
    const a = analyzeGame(g, books, market);
    analyses.set(g.id, a);
    allEdges.push(...a.edges);
    for (const [bk, vig] of Object.entries(a.bookVigs)) {
      (allBookVigs[bk] || (allBookVigs[bk] = [])).push(vig);
    }
  }

  // Sort.
  if (sortBy === 'edge') {
    games.sort((a, b) => (analyses.get(b.id)?.bestEdge || 0) - (analyses.get(a.id)?.bestEdge || 0));
  } else if (sortBy === 'vig') {
    games.sort((a, b) => (analyses.get(a.id)?.sharpVig || 99) - (analyses.get(b.id)?.sharpVig || 99));
  } else {
    games.sort((a, b) => new Date(a.commence_time || 0) - new Date(b.commence_time || 0));
  }

  renderStatsBar(games.length, books, allBookVigs);
  renderEdgeFinder(allEdges);
  renderGames(games, books, market, analyses, sortBy);
  document.getElementById('game-count').textContent = games.length + ' games';
}

/* --- Stats bar --- */

function renderStatsBar(count, books, allBookVigs) {
  const el = document.getElementById('stats-bar');
  if (!count) { el.style.display = 'none'; return; }
  el.style.display = 'flex';

  const avgs = [];
  for (const bk of books) {
    const v = allBookVigs[bk.key];
    if (v && v.length) {
      avgs.push({ key: bk.key, title: bk.title, avg: v.reduce((a,b)=>a+b,0)/v.length, isSharp: bk.is_sharp });
    }
  }
  avgs.sort((a, b) => a.avg - b.avg);

  const overall = avgs.length ? avgs.reduce((s, b) => s + b.avg, 0) / avgs.length : 0;

  let h = `
    <div class="stat">Games <span class="stat-value">${count}</span></div>
    <div class="stat-divider"></div>
    <div class="stat">Books <span class="stat-value">${avgs.length}</span></div>
    <div class="stat-divider"></div>
    <div class="stat">Avg Vig <span class="stat-value">${overall.toFixed(1)}%</span></div>
    <div class="book-chips">`;

  for (const b of avgs) {
    const vc = b.avg < 3 ? 'vl' : b.avg < 5 ? 'vm' : 'vh';
    const sc = b.isSharp ? ' sharp' : '';
    const lbl = b.title.length > 10 ? b.key.slice(0, 8) : b.title;
    h += `<span class="vig-chip${sc}" title="${b.title}: ${b.avg.toFixed(1)}% avg vig">${lbl} <span class="vig-val ${vc}">${b.avg.toFixed(1)}%</span></span>`;
  }
  h += '</div>';
  el.innerHTML = h;
}

/* --- Edge finder --- */

function renderEdgeFinder(edges) {
  const el = document.getElementById('edge-finder');
  const badge = document.getElementById('edge-badge');
  const tbody = document.getElementById('edge-tbody');

  el.style.display = 'block';
  badge.textContent = edges.length;
  badge.className = 'edge-badge ' + (edges.length ? 'has' : 'none');

  if (!edges.length) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#5a6378;padding:16px">No +EV edges found in current data</td></tr>';
    return;
  }

  edges.sort((a, b) => b.ev - a.ev);
  let h = '';
  for (const e of edges) {
    const ec = e.ev >= 5 ? 'ev-great' : 'ev-pos';
    const pt = e.point != null ? ' (' + (e.point > 0 ? '+' : '') + e.point + ')' : '';
    h += `<tr>
      <td>${e.game}</td>
      <td>${e.side}${pt}</td>
      <td>${e.book}</td>
      <td>${fmtByFmt(e.odds, currentFormat)}</td>
      <td style="color:#ffc107">${(e.trueProb * 100).toFixed(1)}%</td>
      <td class="${ec}">+${e.ev.toFixed(1)}%</td>
    </tr>`;
  }
  tbody.innerHTML = h;
}

/* --- Game cards --- */

function renderGames(games, books, market, analyses, sortBy) {
  const container = document.getElementById('odds-content');
  if (!games.length) {
    container.innerHTML = '<div class="message">No games found. Try a different sport or check back later.</div>';
    return;
  }

  let html = '';
  let lastDG = '';

  for (const game of games) {
    // Date separators only when sorting by time.
    if (sortBy === 'time') {
      const dg = dateGroup(game.commence_time);
      if (dg !== lastDG) {
        html += `<div class="date-sep">${dg}</div>`;
        lastDG = dg;
      }
    }

    const a = analyses.get(game.id) || {};
    const bookOdds = game.book_odds || {};
    const bestOdds = game.best_odds || {};
    const { sideKeys = [], bookVigs = {}, trueLine, edges = [] } = a;

    // Edge badge on the game card.
    let edgeBadge = '';
    if (edges.length) {
      const best = Math.max(...edges.map(e => e.ev));
      edgeBadge = `<span class="edge-tag">${edges.length} edge${edges.length !== 1 ? 's' : ''} &middot; best +${best.toFixed(1)}%</span>`;
    }

    html += `<div class="game-card">
      <div class="game-hdr">
        <div class="game-teams">
          <span>${game.away_team} @ ${game.home_team}</span>
          ${timeBadge(game.commence_time)}
          ${edgeBadge}
        </div>
        <div class="game-time">${fmtTime(game.commence_time)}</div>
      </div>
      <div class="odds-grid"><table class="otbl">
        <thead><tr><th class="sh">Side</th>`;

    for (const bk of books) {
      const cls = bk.is_sharp ? ' sk' : '';
      const lbl = bk.title.length > 12 ? bk.key.slice(0, 10) : bk.title;
      html += `<th class="${cls}" title="${bk.title}">${lbl}</th>`;
    }
    html += '</tr></thead><tbody>';

    // Odds rows — one per side.
    for (const side of sideKeys) {
      const best = bestOdds[side] || {};
      const tp = trueLine ? trueLine[side] : null;

      // Side cell with optional true probability.
      html += '<tr><td class="sc">';
      html += `<div>${side}</div>`;
      if (tp != null) {
        const fairOdds = impliedToAmerican(tp);
        html += `<div class="side-true">Fair: ${(tp * 100).toFixed(1)}% / ${fmtOdds(fairOdds)}</div>`;
      }
      html += '</td>';

      // One cell per book.
      for (const bk of books) {
        const bd = bookOdds[bk.key] || {};
        const sd = bd[side];

        if (!sd) { html += '<td class="odds-cell o-na">\u2014</td>'; continue; }

        const odds = sd.odds;
        const point = sd.point;
        const isBest = best.best_book === bk.key;
        const isSharp = bk.is_sharp;

        // EV check.
        let hasEV = false, evPct = 0;
        if (tp && !SHARP_BOOKS.has(bk.key)) {
          evPct = calculateEV(tp, odds);
          hasEV = evPct > 0;
        }

        let cls = 'o-norm';
        if (isBest) cls = 'o-best';
        else if (isSharp) cls = 'o-sharp';

        let content = fmtByFmt(odds, currentFormat);
        if (point != null && market !== 'h2h') {
          const pfx = point > 0 ? '+' : '';
          content = `<span class="o-pt">${pfx}${point}</span>${fmtByFmt(odds, currentFormat)}`;
        }

        const evDot = hasEV ? `<span class="ev-dot" title="+${evPct.toFixed(1)}% EV"></span>` : '';
        const ttip = bk.title + ': ' + fmtOdds(odds) + (hasEV ? ' | +' + evPct.toFixed(1) + '% EV' : '');
        html += `<td class="odds-cell ${cls}" title="${ttip}">${content}${evDot}</td>`;
      }
      html += '</tr>';
    }

    // Vig row.
    html += '<tr class="vig-row"><td class="sc" style="font-size:10px;color:#5a6378">VIG</td>';
    for (const bk of books) {
      const vig = bookVigs[bk.key];
      if (vig == null) { html += '<td>\u2014</td>'; continue; }
      const vc = vig < 3 ? 'vl' : vig < 5 ? 'vm' : 'vh';
      html += `<td class="${vc}">${vig.toFixed(1)}%</td>`;
    }
    html += '</tr>';

    html += '</tbody></table></div>';

    // Legend row (only on first card).
    if (games.indexOf(game) === 0) {
      html += `<div class="help-row">
        <span><span class="dot-ex"></span> = +EV vs sharp line</span>
        <span style="color:#00e676;font-weight:700">Green</span> = best odds
        <span style="color:#ffc107">Gold</span> = sharp book
        <span class="vl">Low vig</span> &lt;3%
        <span class="vm">Med vig</span> 3-5%
        <span class="vh">High vig</span> &gt;5%
      </div>`;
    }

    html += '</div>';
  }

  container.innerHTML = html;
}

/* ===== Fetch ===== */

async function fetchOdds() {
  const sport = document.getElementById('filter-sport').value;
  const market = document.getElementById('filter-market').value;

  document.getElementById('odds-content').innerHTML =
    '<div class="message"><div class="spinner"></div>Fetching live odds...</div>';

  try {
    const res = await fetch(API + '/odds-screen/' + sport + '?market=' + market);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    currentData = data;
    renderAll();
    setStatus(true, 'Live \u00b7 ' + new Date().toLocaleTimeString());
  } catch (e) {
    setStatus(false, 'Error: ' + e.message);
    document.getElementById('odds-content').innerHTML =
      '<div class="message error">Failed to fetch odds: ' + e.message + '</div>';
  }
  countdown = REFRESH;
}

/* ===== Event handlers ===== */

document.getElementById('filter-sport').addEventListener('change', fetchOdds);
document.getElementById('filter-market').addEventListener('change', fetchOdds);
document.getElementById('search-input').addEventListener('input', renderAll);
document.getElementById('sort-by').addEventListener('change', renderAll);

document.querySelectorAll('.fmt-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.fmt-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFormat = btn.dataset.fmt;
    renderAll();
  });
});

document.getElementById('edge-toggle').addEventListener('click', () => {
  edgeOpen = !edgeOpen;
  document.getElementById('edge-body').classList.toggle('open', edgeOpen);
  document.getElementById('edge-arrow').textContent = edgeOpen ? 'COLLAPSE' : 'EXPAND';
});

/* ===== Timer ===== */

function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    countdown--;
    document.getElementById('refresh-timer').textContent = 'refresh in ' + countdown + 's';
    if (countdown <= 0) fetchOdds();
  }, 1000);
}

fetchOdds();
startTimer();
</script>
</body>
</html>
