<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTM Picks — +EV Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{
    background:#0a0e17;color:#c8cdd6;
    font-family:'SF Mono','Fira Code','Cascadia Code',Consolas,monospace;
    font-size:13px;line-height:1.5;
  }
  a{color:#42a5f5;text-decoration:none}
  a:hover{text-decoration:underline}
  .container{max-width:1400px;margin:0 auto;padding:16px 24px}

  /* Header */
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 0;margin-bottom:4px;position:relative;
  }
  header::after{
    content:'';position:absolute;bottom:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,#00e676,#42a5f5,#ce93d8,#ff5252);opacity:.5;
  }
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand h1{font-size:20px;font-weight:700;color:#e1e5eb;letter-spacing:1px}
  .brand h1 span{color:#00e676}
  .brand .tagline{font-size:11px;color:#5a6378;text-transform:uppercase;letter-spacing:2px}
  .status-bar{display:flex;align-items:center;gap:16px;font-size:11px;color:#5a6378}
  .status-bar .dot{
    width:7px;height:7px;border-radius:50%;display:inline-block;
    background:#00e676;box-shadow:0 0 6px #00e67680;animation:pulse 2s ease-in-out infinite;
  }
  .status-bar .dot.error{background:#ff5252;box-shadow:0 0 6px #ff525280;animation:none}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  .refresh-btn{
    background:none;border:1px solid #1a2035;color:#5a6378;border-radius:4px;
    padding:3px 10px;cursor:pointer;font-family:inherit;font-size:10px;
    letter-spacing:0.5px;transition:all .15s;
  }
  .refresh-btn:hover{color:#00e676;border-color:#00e676}

  /* Nav */
  nav{
    display:flex;gap:24px;padding:10px 0;border-bottom:1px solid #1a2035;margin-bottom:20px;
    font-size:12px;text-transform:uppercase;letter-spacing:1.5px;overflow-x:auto;
  }
  nav a{color:#5a6378;padding:4px 0;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s}
  nav a:hover{color:#c8cdd6;text-decoration:none}
  nav a.active{color:#00e676;border-bottom-color:#00e676}

  /* Stats bar */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
  .stat-card{
    background:linear-gradient(135deg,#111827 0%,#0f1521 100%);
    border:1px solid #1a2035;border-radius:8px;
    padding:14px 18px;transition:border-color .2s;
  }
  .stat-card:hover{border-color:#2a3555}
  .stat-card .label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:#5a6378;margin-bottom:4px}
  .stat-card .value{font-size:24px;font-weight:700;color:#e1e5eb}
  .stat-card .value.green{color:#00e676}
  .stat-card .value.yellow{color:#ffc107}
  .stat-card .value.blue{color:#42a5f5}
  .stat-card .value.red{color:#ff5252}

  /* Filters */
  .filters{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
  .filter-group{display:flex;flex-direction:column;gap:2px}
  .filter-group label{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:#5a6378}
  .filter-group select,.filter-group input{
    background:#111827;color:#c8cdd6;border:1px solid #1a2035;border-radius:6px;
    padding:7px 12px;font-family:inherit;font-size:12px;min-width:130px;cursor:pointer;
  }
  .filter-group select:focus,.filter-group input:focus{outline:none;border-color:#2a3555}
  .search-box{min-width:200px}

  /* Section headers */
  .section-header{
    display:flex;align-items:center;justify-content:space-between;
    margin:24px 0 14px;padding-bottom:8px;border-bottom:1px solid #1a2035;
  }
  .section-title{font-size:14px;font-weight:700;color:#e1e5eb;text-transform:uppercase;letter-spacing:1.5px}
  .opp-count{font-size:12px;color:#5a6378}

  /* Sport badge */
  .sport-badge{
    display:inline-block;padding:2px 8px;border-radius:3px;
    font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  }
  .sport-mlb{background:#1a2a1a;color:#4caf50;border:1px solid #2e4a2e}
  .sport-nba{background:#1a1a2e;color:#5c6bc0;border:1px solid #2e2e5c}
  .sport-nfl{background:#2a1a1a;color:#a1887f;border:1px solid #4a2e2e}
  .sport-nhl{background:#1a2a2a;color:#4dd0e1;border:1px solid #2e4a4a}
  .sport-cfb{background:#2a2a1a;color:#ffb74d;border:1px solid #4a4a2e}
  .sport-cbb{background:#2a1a2a;color:#ba68c8;border:1px solid #4a2e4a}
  .sport-default{background:#1a1a1a;color:#8892a4;border:1px solid #2a2a2a}

  /* Opportunity cards grid */
  .opp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;margin-bottom:24px}

  .opp-card{
    background:linear-gradient(135deg,#111827 0%,#0f1521 100%);
    border:1px solid #1a2035;border-radius:8px;
    padding:16px 18px;cursor:pointer;transition:all .2s;
    position:relative;overflow:hidden;
  }
  .opp-card:hover{border-color:#2a3555;transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.3)}
  .opp-card.expanded{border-color:#2a3555;box-shadow:0 0 20px rgba(0,0,0,.3)}

  /* EV prominence */
  .opp-ev-bar{
    position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,#ffc107,#00e676);
  }
  .opp-card.ev-high .opp-ev-bar{background:linear-gradient(90deg,#00e676,#00e676)}
  .opp-card.ev-medium .opp-ev-bar{background:linear-gradient(90deg,#ffc107,#ffc107)}

  .opp-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;margin-top:4px}
  .opp-ev{font-size:28px;font-weight:800;letter-spacing:-0.5px}
  .opp-ev.high{color:#00e676}
  .opp-ev.medium{color:#ffc107}
  .opp-ev-label{font-size:9px;color:#5a6378;text-transform:uppercase;letter-spacing:1px}

  .opp-time-badge{
    display:inline-flex;align-items:center;gap:4px;
    padding:3px 8px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:0.5px;
  }
  .opp-time-badge.early{background:#00e67615;color:#00e676;border:1px solid #00e67640}
  .opp-time-badge.today{background:#ffc10715;color:#ffc107;border:1px solid #ffc10740}
  .opp-time-badge.urgent{background:#ff525220;color:#ff5252;border:1px solid #ff525240;animation:urgentPulse 1.5s ease-in-out infinite}
  .opp-time-badge.live{background:#ff525230;color:#ff5252;border:1px solid #ff525260;animation:urgentPulse 1s ease-in-out infinite}
  @keyframes urgentPulse{0%,100%{opacity:1}50%{opacity:.6}}

  .opp-play{font-size:15px;font-weight:700;color:#e1e5eb;margin-bottom:4px}
  .opp-game{font-size:12px;color:#8892a4;margin-bottom:10px}

  .opp-details{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}
  .opp-detail{display:flex;flex-direction:column}
  .opp-detail .od-label{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:#5a6378}
  .opp-detail .od-value{font-size:13px;font-weight:600;color:#e1e5eb}
  .od-value.book{color:#ce93d8;text-transform:uppercase}
  .od-value.kelly{color:#42a5f5}
  .od-value.fair{color:#8892a4}

  /* Expanded section */
  .opp-expanded{
    display:none;margin-top:12px;padding-top:12px;border-top:1px solid #1a2035;
  }
  .opp-card.expanded .opp-expanded{display:block}
  .opp-chart-wrap{height:220px;margin-bottom:8px;position:relative}
  .opp-chart-wrap canvas{width:100%!important;height:100%!important}
  .opp-other-books{font-size:11px;color:#5a6378}
  .opp-other-books table{margin-top:6px}
  .opp-other-books table th{font-size:9px;padding:4px 8px;text-align:left}
  .opp-other-books table td{font-size:11px;padding:4px 8px;border-bottom:1px solid #131b2e}

  /* Date separator */
  .date-sep{
    padding:10px 0;font-size:12px;font-weight:700;color:#5a6378;
    text-transform:uppercase;letter-spacing:1.5px;
    border-bottom:1px solid #131b2e;margin-bottom:12px;
    display:flex;align-items:center;gap:8px;
  }
  .date-sep .date-count{
    background:#111827;border:1px solid #1a2035;border-radius:10px;
    padding:1px 8px;font-size:10px;color:#8892a4;font-weight:600;
  }

  /* Loading / empty */
  .message{text-align:center;padding:60px 20px;color:#5a6378}
  .message.error{color:#ff5252}
  .spinner{
    width:28px;height:28px;border:3px solid #1a2035;border-top-color:#00e676;
    border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .empty-state{
    text-align:center;padding:48px 20px;color:#5a6378;
    background:#111827;border:1px solid #1a2035;border-radius:8px;
  }
  .empty-state .empty-title{font-size:14px;color:#8892a4;font-weight:600;margin-bottom:4px}

  @media(max-width:768px){
    .container{padding:10px 12px}
    .opp-grid{grid-template-columns:1fr}
    .stats{grid-template-columns:repeat(3,1fr)}
    .stat-card .value{font-size:18px}
    .stat-card{padding:10px 14px}
    .filters{gap:6px}
    .filter-group select,.filter-group input{min-width:100px;font-size:11px}
    .opp-details{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="brand">
      <h1>RTM <span>Picks</span></h1>
      <span class="tagline">+EV Command Center</span>
    </div>
    <div class="status-bar">
      <span id="status-dot" class="dot"></span>
      <span id="status-text">Connecting...</span>
      <span class="count" id="refresh-timer"></span>
      <button class="refresh-btn" onclick="fetchData()">Refresh</button>
    </div>
  </header>

  <nav>
    <a href="dashboard.html" class="active">Dashboard</a>
    <a href="signal.html">Signal</a>
    <a href="sharp-tracker.html">Sharp Tracker</a>
    <a href="props.html">Props</a>
    <a href="odds-screen.html">Odds Screen</a>
    <a href="performance.html">Performance</a>
    <a href="clv-report.html">CLV Report</a>
    <a href="daily-recap.html">Daily Recap</a>
    <a href="bankroll.html">Bankroll</a>
  </nav>

  <!-- Stats Bar -->
  <div class="stats">
    <div class="stat-card"><div class="label">Games Tracked (48h)</div><div class="value" id="stat-games">—</div></div>
    <div class="stat-card"><div class="label">Opportunities</div><div class="value green" id="stat-opps">—</div></div>
    <div class="stat-card"><div class="label">Signals Generated</div><div class="value blue" id="stat-signals">—</div></div>
    <div class="stat-card"><div class="label">Early Lines</div><div class="value green" id="stat-early">—</div></div>
    <div class="stat-card"><div class="label">Props</div><div class="value" id="stat-props">—</div></div>
    <div class="stat-card"><div class="label">Best EV%</div><div class="value yellow" id="stat-best-ev">—</div></div>
  </div>

  <!-- Filters -->
  <div class="filters">
    <div class="filter-group">
      <label>Sport</label>
      <select id="filter-sport"><option value="">All Sports</option></select>
    </div>
    <div class="filter-group">
      <label>Time Window</label>
      <select id="filter-time">
        <option value="all" selected>All Upcoming (48h)</option>
        <option value="today">Today</option>
        <option value="tomorrow">Tomorrow</option>
        <option value="soon">Starting Soon (&lt; 6h)</option>
        <option value="early">Early Lines (24h+)</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Min EV%</label>
      <select id="filter-ev">
        <option value="0">All</option>
        <option value="1" selected>1%+</option>
        <option value="2">2%+</option>
        <option value="3">3%+</option>
        <option value="5">5%+</option>
        <option value="10">10%+</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Sort By</label>
      <select id="filter-sort">
        <option value="ev">EV %</option>
        <option value="time">Game Time</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Search</label>
      <input type="text" id="filter-search" class="search-box" placeholder="Team or player...">
    </div>
  </div>

  <!-- Opportunity Cards -->
  <div class="section-header">
    <div class="section-title">+EV Opportunities</div>
    <div class="opp-count" id="opp-count"></div>
  </div>
  <div id="opp-container">
    <div class="message"><div class="spinner"></div>Scanning for opportunities...</div>
  </div>
</div>

<script>
const API_HOST = (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost')
  ? 'http://localhost:8000' : '';
const API = API_HOST + '/api';
const REFRESH_INTERVAL = 60;

let allOpps = [];
let signalCount = 0;
let countdown = REFRESH_INTERVAL;
let timerInterval = null;
let expandedCharts = {}; // gameId -> Chart instance

function sportKey(raw) {
  if (!raw) return "default";
  const s = raw.toLowerCase();
  if (s.includes("mlb") || s.includes("baseball")) return "mlb";
  if (s.includes("nba") || s.includes("basketball_nba")) return "nba";
  if (s.includes("nfl") || s.includes("football_nfl")) return "nfl";
  if (s.includes("nhl") || s.includes("hockey")) return "nhl";
  if (s.includes("ncaaf") || s.includes("football_ncaa")) return "cfb";
  if (s.includes("ncaab") || s.includes("basketball_ncaa")) return "cbb";
  return "default";
}

function sportLabel(raw) {
  const map = {mlb:"MLB",nba:"NBA",nfl:"NFL",nhl:"NHL",cfb:"CFB",cbb:"CBB"};
  return map[sportKey(raw)] || raw || "\u2014";
}

function fmtOdds(v) { const n=Number(v); return isNaN(n)?String(v):n>0?"+"+n:String(n); }
function fmtPct(v) { const n=Number(v); return isNaN(n)?"\u2014":n.toFixed(2)+"%"; }
function fmtDecimalAsPct(v) { const n=Number(v); return isNaN(n)?"\u2014":(n*100).toFixed(1)+"%"; }
function gameName(g) { return g?(g.away_team||"Away")+" @ "+(g.home_team||"Home"):"\u2014"; }
function isProps(mt) { return mt && mt.startsWith("player_"); }

function getCommenceTime(o) {
  return o.commence_time || (o.games && (o.games.commence_time || o.games.start_time)) || null;
}

function getHoursUntil(o) {
  const ct = getCommenceTime(o);
  if (!ct) return null;
  const start = new Date(ct);
  if (isNaN(start)) return null;
  return (start - Date.now()) / 3600000;
}

function formatHoursMinutes(h) {
  if (h < 0) return '0m';
  const hours = Math.floor(h);
  const mins = Math.round((h - hours) * 60);
  if (hours === 0) return mins + 'm';
  if (mins === 0) return hours + 'h';
  return hours + 'h ' + mins + 'm';
}

function timeBadge(o) {
  const h = getHoursUntil(o);
  if (h === null) return '';
  if (h < -0.5) return '<span class="opp-time-badge live">LIVE</span>';
  if (h < 0) return '<span class="opp-time-badge live">STARTING</span>';
  if (h < 3) return `<span class="opp-time-badge urgent">URGENT — ${formatHoursMinutes(h)}</span>`;
  if (h < 12) return `<span class="opp-time-badge today">TODAY — ${formatHoursMinutes(h)}</span>`;
  if (h >= 24) return `<span class="opp-time-badge early">EARLY LINE — ${formatHoursMinutes(h)}</span>`;
  return `<span class="opp-time-badge today">${formatHoursMinutes(h)} to game</span>`;
}

function getDateGroup(o) {
  const ct = getCommenceTime(o);
  if (!ct) return 'Unknown';
  const start = new Date(ct);
  if (isNaN(start)) return 'Unknown';
  const now = new Date();
  const tomorrow = new Date(now); tomorrow.setDate(tomorrow.getDate()+1);
  const opts = { timeZone: 'America/New_York' };
  const startDate = start.toLocaleDateString('en-US', opts);
  const nowDate = now.toLocaleDateString('en-US', opts);
  const tomDate = tomorrow.toLocaleDateString('en-US', opts);
  if (startDate === nowDate) return 'Today';
  if (startDate === tomDate) return 'Tomorrow';
  return start.toLocaleDateString('en-US', {weekday:'long',month:'short',day:'numeric',timeZone:'America/New_York'});
}

function setStatus(ok, text) {
  document.getElementById("status-dot").className = ok?"dot":"dot error";
  document.getElementById("status-text").textContent = text;
}

// ---- Filtering ----
function getFiltered() {
  const sportF = document.getElementById("filter-sport").value;
  const timeF = document.getElementById("filter-time").value;
  const evF = Number(document.getElementById("filter-ev").value) || 0;
  const searchF = document.getElementById("filter-search").value.toLowerCase().trim();

  return allOpps.filter(o => {
    const g = o.games || {};
    const ev = Number(o.ev_percentage) || 0;
    if (ev < evF) return false;
    if (sportF && (g.sport||"") !== sportF) return false;

    if (timeF !== "all") {
      const h = getHoursUntil(o);
      if (h === null) return timeF === "all";
      if (timeF === "today" && getDateGroup(o) !== "Today") return false;
      if (timeF === "tomorrow" && getDateGroup(o) !== "Tomorrow") return false;
      if (timeF === "soon" && (h > 6 || h < -3)) return false;
      if (timeF === "early" && h < 24) return false;
    }

    if (searchF) {
      const haystack = ((g.home_team||"")+" "+(g.away_team||"")+" "+(o.side||"")).toLowerCase();
      if (!haystack.includes(searchF)) return false;
    }
    return true;
  });
}

function populateFilters() {
  const sports = new Map();
  allOpps.forEach(o => {
    const sp = (o.games||{}).sport || "";
    if (sp) sports.set(sp, (sports.get(sp)||0)+1);
  });
  const sportSel = document.getElementById("filter-sport");
  const cur = sportSel.value;
  sportSel.innerHTML = `<option value="">All Sports (${allOpps.length})</option>`;
  [...sports.entries()].sort((a,b)=>b[1]-a[1]).forEach(([k,c])=>{
    sportSel.innerHTML += `<option value="${k}">${sportLabel(k)} (${c})</option>`;
  });
  sportSel.value = cur;
}

// ---- Stats ----
function updateStats(filtered) {
  const uniqueGames = new Set(filtered.map(o=>o.game_id)).size;
  const propCount = filtered.filter(o=>isProps(o.market_type)).length;
  const earlyCount = filtered.filter(o=>{const h=getHoursUntil(o);return h!==null&&h>=24}).length;

  document.getElementById("stat-games").textContent = uniqueGames;
  document.getElementById("stat-opps").textContent = filtered.length;
  document.getElementById("stat-signals").textContent = signalCount;
  document.getElementById("stat-early").textContent = earlyCount;
  document.getElementById("stat-props").textContent = propCount;

  if (filtered.length) {
    const evs = filtered.map(o=>Number(o.ev_percentage)||0);
    document.getElementById("stat-best-ev").textContent = Math.max(...evs).toFixed(2)+"%";
  } else {
    document.getElementById("stat-best-ev").textContent = "\u2014";
  }
}

// ---- Render Opportunity Cards ----
function renderOpps(opps) {
  const container = document.getElementById("opp-container");
  document.getElementById("opp-count").textContent = opps.length + " opportunities";

  if (!opps.length) {
    container.innerHTML = `<div class="empty-state">
      <div class="empty-title">No opportunities match your filters</div>
      <div>Try adjusting your filters or wait for the next scan cycle.</div>
    </div>`;
    return;
  }

  // Destroy any existing expanded charts
  Object.values(expandedCharts).forEach(c => c.destroy());
  expandedCharts = {};

  const sortMode = document.getElementById("filter-sort").value;
  let html = '';
  let lastDateGroup = '';

  opps.forEach((o, idx) => {
    const g = o.games || {};
    const sk = sportKey(g.sport);
    const ev = Number(o.ev_percentage) || 0;
    const evClass = ev >= 5 ? 'high' : 'medium';
    const cardEvClass = ev >= 5 ? 'ev-high' : 'ev-medium';
    const gameId = o.game_id || '';
    const cardId = 'opp-' + idx;

    // Kelly sizing (clamped to 3u max)
    let kellyRaw = Number(o.kelly_fraction) || 0;
    let kellyUnits = Math.min(kellyRaw * 10, 3).toFixed(1); // fractional kelly * bankroll factor, max 3u

    // Fair value odds
    const trueProb = Number(o.true_prob) || 0;
    let fairOdds = "\u2014";
    if (trueProb > 0 && trueProb < 1) {
      if (trueProb >= 0.5) {
        fairOdds = fmtOdds(Math.round(-100 * trueProb / (1 - trueProb)));
      } else {
        fairOdds = fmtOdds(Math.round(100 * (1 - trueProb) / trueProb));
      }
    }

    // Date separator
    if (sortMode === 'time') {
      const dg = getDateGroup(o);
      if (dg !== lastDateGroup) {
        lastDateGroup = dg;
        const dgCount = opps.filter(x => getDateGroup(x) === dg).length;
        html += `<div class="date-sep">${dg} <span class="date-count">${dgCount}</span></div>`;
      }
    }

    html += `<div class="opp-card ${cardEvClass}" id="${cardId}" onclick="toggleExpand('${cardId}','${gameId}','${(o.side||'').replace(/'/g,"\\'")}','${o.market_type||''}')">
      <div class="opp-ev-bar"></div>
      <div class="opp-top">
        <div>
          <div class="opp-ev ${evClass}">${fmtPct(ev)}</div>
          <div class="opp-ev-label">Edge</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
          ${timeBadge(o)}
          <span class="sport-badge sport-${sk}">${sportLabel(g.sport)}</span>
        </div>
      </div>
      <div class="opp-play">${o.side || "\u2014"}</div>
      <div class="opp-game">${gameName(g)} · ${o.market_type || "h2h"}</div>
      <div class="opp-details">
        <div class="opp-detail">
          <span class="od-label">Sportsbook</span>
          <span class="od-value book">${o.sportsbook || "\u2014"}</span>
        </div>
        <div class="opp-detail">
          <span class="od-label">Odds</span>
          <span class="od-value">${fmtOdds(o.book_odds)}</span>
        </div>
        <div class="opp-detail">
          <span class="od-label">Fair Value</span>
          <span class="od-value fair">${fairOdds}</span>
        </div>
        <div class="opp-detail">
          <span class="od-label">True Prob</span>
          <span class="od-value">${fmtDecimalAsPct(trueProb)}</span>
        </div>
        <div class="opp-detail">
          <span class="od-label">Kelly Size</span>
          <span class="od-value kelly">${kellyUnits}u</span>
        </div>
        <div class="opp-detail">
          <span class="od-label">Game Time</span>
          <span class="od-value">${formatGameTime(o)}</span>
        </div>
      </div>
      <div class="opp-expanded">
        <div class="opp-chart-wrap"><canvas id="chart-${cardId}"></canvas></div>
        <div class="opp-other-books" id="books-${cardId}">Loading other books...</div>
      </div>
    </div>`;
  });

  // Wrap cards in grid if sorting by EV, otherwise flow with date separators
  if (sortMode === 'time') {
    container.innerHTML = html;
  } else {
    container.innerHTML = `<div class="opp-grid">${html}</div>`;
  }
}

function formatGameTime(o) {
  const ct = getCommenceTime(o);
  if (!ct) return "\u2014";
  const d = new Date(ct);
  return d.toLocaleTimeString('en-US', {
    hour: 'numeric', minute: '2-digit', timeZone: 'America/New_York'
  }) + ' ET';
}

// ---- Expand/Collapse ----
async function toggleExpand(cardId, gameId, side, marketType) {
  const card = document.getElementById(cardId);
  if (!card) return;

  if (card.classList.contains('expanded')) {
    card.classList.remove('expanded');
    if (expandedCharts[cardId]) {
      expandedCharts[cardId].destroy();
      delete expandedCharts[cardId];
    }
    return;
  }

  card.classList.add('expanded');

  // Load line movement chart for this game
  try {
    const url = API + "/line-movements/" + encodeURIComponent(gameId) +
      (marketType ? "?market_type=" + encodeURIComponent(marketType) : "");
    const res = await fetch(url);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const movements = data.movements || [];

    const canvas = document.getElementById('chart-' + cardId);
    if (!canvas) return;

    if (movements.length) {
      // Group by bookmaker
      const byBook = {};
      const BOOK_COLORS = ['#ffd700','#42a5f5','#00e676','#ff7043','#ce93d8','#4dd0e1','#ffb74d','#e57373'];
      let colorIdx = 0;

      for (const m of movements) {
        const key = m.bookmaker;
        if (!byBook[key]) byBook[key] = { data: [], color: BOOK_COLORS[colorIdx++ % BOOK_COLORS.length] };
        byBook[key].data.push({ x: new Date(m.timestamp), y: Number(m.odds) });
      }

      const datasets = Object.entries(byBook).map(([name, info]) => ({
        label: name,
        data: info.data.sort((a,b) => a.x - b.x),
        borderColor: info.color,
        borderWidth: 1.5,
        pointRadius: 2,
        tension: 0.2,
        fill: false,
      }));

      if (expandedCharts[cardId]) expandedCharts[cardId].destroy();
      expandedCharts[cardId] = new Chart(canvas.getContext('2d'), {
        type: 'line',
        data: { datasets },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: { labels: { color: '#8892a4', font: { family: 'monospace', size: 9 } } },
            tooltip: {
              backgroundColor: '#0d1220', borderColor: '#2a3555', borderWidth: 1,
              titleColor: '#e1e5eb', bodyColor: '#c8cdd6',
              bodyFont: { family: 'monospace', size: 10 },
            },
          },
          scales: {
            x: { type: 'time', ticks: { color: '#5a6378', font: { family: 'monospace', size: 9 }, maxTicksLimit: 6 }, grid: { color: '#131b2e' } },
            y: { ticks: { color: '#5a6378', font: { family: 'monospace', size: 9 }, callback: v => (v>0?'+':'')+v }, grid: { color: '#131b2e' } },
          },
        },
      });

      // Show other books
      const booksDiv = document.getElementById('books-' + cardId);
      const bookList = Object.keys(byBook);
      if (bookList.length > 1) {
        const lastByBook = {};
        movements.forEach(m => {
          if (!lastByBook[m.bookmaker] || new Date(m.timestamp) > new Date(lastByBook[m.bookmaker].timestamp)) {
            lastByBook[m.bookmaker] = m;
          }
        });
        let bhtml = '<table><thead><tr><th>Book</th><th>Current Odds</th><th>Last Update</th></tr></thead><tbody>';
        Object.entries(lastByBook).sort((a,b) => (Number(a[1].odds)||0) - (Number(b[1].odds)||0)).forEach(([name, m]) => {
          bhtml += `<tr><td style="color:#ce93d8">${name}</td><td>${fmtOdds(m.odds)}</td><td style="color:#5a6378">${timeAgo(m.timestamp)}</td></tr>`;
        });
        bhtml += '</tbody></table>';
        booksDiv.innerHTML = bhtml;
      } else {
        booksDiv.innerHTML = '<div style="color:#5a6378;font-size:11px">Limited book data available</div>';
      }
    } else {
      canvas.parentElement.innerHTML = '<div style="text-align:center;padding:20px;color:#5a6378;font-size:11px">No line movement data for this game yet</div>';
    }
  } catch (e) {
    const canvas = document.getElementById('chart-' + cardId);
    if (canvas) canvas.parentElement.innerHTML = `<div style="text-align:center;padding:20px;color:#ff5252;font-size:11px">Error: ${e.message}</div>`;
  }
}

function timeAgo(ts) {
  if (!ts) return "\u2014";
  const diff = (Date.now() - new Date(ts).getTime()) / 60000;
  if (diff < 1) return "just now";
  if (diff < 60) return Math.round(diff) + "m ago";
  if (diff < 1440) return Math.round(diff / 60) + "h ago";
  return Math.round(diff / 1440) + "d ago";
}

// ---- Apply Filters & Sort ----
function applyFilters() {
  const filtered = getFiltered();
  const sortMode = document.getElementById("filter-sort").value;

  if (sortMode === "time") {
    filtered.sort((a,b) => {
      const ctA = getCommenceTime(a) || '';
      const ctB = getCommenceTime(b) || '';
      const cmp = ctA.localeCompare(ctB);
      if (cmp !== 0) return cmp;
      return (Number(b.ev_percentage)||0) - (Number(a.ev_percentage)||0);
    });
  } else {
    filtered.sort((a,b) => (Number(b.ev_percentage)||0) - (Number(a.ev_percentage)||0));
  }

  renderOpps(filtered);
  updateStats(filtered);
}

// ---- Data Fetch ----
async function fetchData() {
  try {
    // Fetch EV opportunities and signals in parallel for consistent counts
    const [evRes, sigRes] = await Promise.all([
      fetch(API + "/ev-opportunities/"),
      fetch(API + "/signals/active?min_stars=1").catch(() => null),
    ]);

    if (!evRes.ok) throw new Error("HTTP " + evRes.status);
    const data = await evRes.json();
    allOpps = data.opportunities || [];

    // Get signal count for stats bar
    if (sigRes && sigRes.ok) {
      try {
        const sigData = await sigRes.json();
        signalCount = sigData.count || (sigData.signals || []).length || 0;
      } catch { signalCount = 0; }
    }

    populateFilters();
    applyFilters();

    const now = new Date().toLocaleTimeString('en-US', { timeZone: 'America/New_York' });
    setStatus(true, "Live \u00b7 updated " + now + " ET");
  } catch (e) {
    setStatus(false, "Error: " + e.message);
    document.getElementById("opp-container").innerHTML =
      `<div class="message error">Failed to fetch data. Is the API running at localhost:8000?</div>`;
  }
  countdown = REFRESH_INTERVAL;
}

// Wire up filters
["filter-sport","filter-time","filter-ev","filter-sort"].forEach(id => {
  document.getElementById(id).addEventListener("change", applyFilters);
});
document.getElementById("filter-search").addEventListener("input", applyFilters);

function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    countdown--;
    document.getElementById("refresh-timer").textContent = "refresh in " + countdown + "s";
    if (countdown <= 0) fetchData();
  }, 1000);
}

fetchData();
startTimer();
</script>
