<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTM Picks — +EV Dashboard</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{
    background:#0a0e17;color:#c8cdd6;
    font-family:'SF Mono','Fira Code','Cascadia Code',Consolas,monospace;
    font-size:13px;line-height:1.5;
  }
  a{color:#42a5f5;text-decoration:none}
  a:hover{text-decoration:underline}
  .container{max-width:1400px;margin:0 auto;padding:16px 24px}

  /* Header */
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 0;border-bottom:1px solid #1a2035;margin-bottom:16px;
  }
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand h1{font-size:20px;font-weight:700;color:#e1e5eb;letter-spacing:1px}
  .brand h1 span{color:#00e676}
  .brand .tagline{font-size:11px;color:#5a6378;text-transform:uppercase;letter-spacing:2px}
  .status-bar{display:flex;align-items:center;gap:16px;font-size:11px;color:#5a6378}
  .status-bar .dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:#00e676;box-shadow:0 0 6px #00e67680}
  .status-bar .dot.error{background:#ff5252;box-shadow:0 0 6px #ff525280}
  .status-bar .count{color:#8892a4}

  /* Nav */
  nav{display:flex;gap:24px;padding:8px 0;border-bottom:1px solid #1a2035;margin-bottom:16px;font-size:12px;text-transform:uppercase;letter-spacing:1.5px}
  nav a{color:#5a6378;text-decoration:none;padding:4px 0;border-bottom:2px solid transparent}
  nav a:hover{color:#c8cdd6}
  nav a.active{color:#00e676;border-bottom-color:#00e676}

  /* Stats row */
  .stats{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .stat-card{background:#111827;border:1px solid #1a2035;border-radius:6px;padding:10px 18px;min-width:140px}
  .stat-card .label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:#5a6378;margin-bottom:2px}
  .stat-card .value{font-size:22px;font-weight:700;color:#e1e5eb}
  .stat-card .value.green{color:#00e676}
  .stat-card .value.yellow{color:#ffc107}

  /* Filters */
  .filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
  .filter-group{display:flex;flex-direction:column;gap:2px}
  .filter-group label{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:#5a6378}
  .filter-group select,.filter-group input{
    background:#111827;color:#c8cdd6;border:1px solid #1a2035;border-radius:4px;
    padding:6px 10px;font-family:inherit;font-size:12px;min-width:120px;
  }
  .filter-group select:focus,.filter-group input:focus{outline:none;border-color:#2a3555}
  .search-box{min-width:200px}
  .filter-count{font-size:10px;color:#5a6378;margin-left:2px}

  /* Table */
  .table-wrap{background:#111827;border:1px solid #1a2035;border-radius:6px;overflow:auto}
  table{width:100%;border-collapse:collapse;white-space:nowrap}
  thead th{
    background:#0d1220;color:#5a6378;font-size:10px;font-weight:600;
    text-transform:uppercase;letter-spacing:1.5px;
    padding:10px 14px;text-align:left;border-bottom:1px solid #1a2035;
    position:sticky;top:0;
  }
  tbody td{padding:9px 14px;border-bottom:1px solid #131b2e}
  tbody tr:hover{background:#151e30}
  tbody tr:last-child td{border-bottom:none}

  /* Sport badge */
  .sport-badge{display:inline-block;padding:2px 8px;border-radius:3px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
  .sport-mlb{background:#1a2a1a;color:#4caf50;border:1px solid #2e4a2e}
  .sport-nba{background:#1a1a2e;color:#5c6bc0;border:1px solid #2e2e5c}
  .sport-nfl{background:#2a1a1a;color:#a1887f;border:1px solid #4a2e2e}
  .sport-nhl{background:#1a2a2a;color:#4dd0e1;border:1px solid #2e4a4a}
  .sport-cfb{background:#2a2a1a;color:#ffb74d;border:1px solid #4a4a2e}
  .sport-cbb{background:#2a1a2a;color:#ba68c8;border:1px solid #4a2e4a}
  .sport-default{background:#1a1a1a;color:#8892a4;border:1px solid #2a2a2a}

  .ev-green{color:#00e676;font-weight:700}
  .ev-yellow{color:#ffc107;font-weight:700}
  .kelly{color:#42a5f5}
  .odds{color:#e1e5eb;font-weight:600}
  .prob{color:#8892a4}
  .sportsbook{color:#ce93d8;font-weight:600;text-transform:uppercase;font-size:11px}
  .side{color:#e1e5eb}
  .market{color:#5a6378;font-size:11px}
  .prop-tag{background:#1a1a2e;color:#7986cb;border:1px solid #2e2e5c;padding:1px 6px;border-radius:3px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px}

  .message{text-align:center;padding:60px 20px;color:#5a6378}
  .message.error{color:#ff5252}
  .spinner{width:28px;height:28px;border:3px solid #1a2035;border-top-color:#00e676;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
  @keyframes spin{to{transform:rotate(360deg)}}

  @media(max-width:768px){
    .container{padding:10px 12px}
    table{font-size:12px}
    thead th,tbody td{padding:7px 8px}
    .stats{gap:8px}
    .stat-card{min-width:100px;padding:8px 12px}
    .stat-card .value{font-size:18px}
    .filters{gap:6px}
    .filter-group select,.filter-group input{min-width:90px;font-size:11px}
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="brand">
      <h1>RTM <span>Picks</span></h1>
      <span class="tagline">+EV Intelligence</span>
    </div>
    <div class="status-bar">
      <span id="status-dot" class="dot"></span>
      <span id="status-text">Connecting...</span>
      <span class="count" id="refresh-timer"></span>
    </div>
  </header>

  <nav>
    <a href="dashboard.html" class="active">+EV Dashboard</a>
    <a href="sharp-tracker.html">Sharp Tracker</a>
    <a href="clv-report.html">CLV Report</a>
  </nav>

  <div class="stats" id="stats-row">
    <div class="stat-card"><div class="label">Showing</div><div class="value" id="stat-count">—</div></div>
    <div class="stat-card"><div class="label">Best EV%</div><div class="value green" id="stat-best-ev">—</div></div>
    <div class="stat-card"><div class="label">Avg EV%</div><div class="value yellow" id="stat-avg-ev">—</div></div>
    <div class="stat-card"><div class="label">Props</div><div class="value" id="stat-props">—</div></div>
  </div>

  <div class="filters">
    <div class="filter-group">
      <label>Sport</label>
      <select id="filter-sport"><option value="">All Sports</option></select>
    </div>
    <div class="filter-group">
      <label>Sportsbook</label>
      <select id="filter-book"><option value="">All Books</option></select>
    </div>
    <div class="filter-group">
      <label>Market</label>
      <select id="filter-market">
        <option value="">All Markets</option>
        <option value="game">Game Lines</option>
        <option value="props">Player Props</option>
        <option value="h2h">Moneyline</option>
        <option value="spreads">Spreads</option>
        <option value="totals">Totals</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Min EV%</label>
      <select id="filter-ev">
        <option value="0">All</option>
        <option value="1" selected>1%+</option>
        <option value="2">2%+</option>
        <option value="3">3%+</option>
        <option value="5">5%+</option>
        <option value="10">10%+</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Search</label>
      <input type="text" id="filter-search" class="search-box" placeholder="Team or player name...">
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Sport</th>
          <th>Game</th>
          <th>Selection</th>
          <th>Market</th>
          <th>Sportsbook</th>
          <th>Odds</th>
          <th>True Prob</th>
          <th>EV%</th>
          <th>Kelly %</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr><td colspan="9" class="message"><div class="spinner"></div>Loading opportunities...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const API_HOST = window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost'
  ? 'http://localhost:8000' : '';
const API_URL = API_HOST + "/api/ev-opportunities/";
const REFRESH_INTERVAL = 60;

let allOpps = [];
let countdown = REFRESH_INTERVAL;
let timerInterval = null;

function sportKey(raw) {
  if (!raw) return "default";
  const s = raw.toLowerCase();
  if (s.includes("mlb") || s.includes("baseball")) return "mlb";
  if (s.includes("nba") || s.includes("basketball_nba")) return "nba";
  if (s.includes("nfl") || s.includes("football_nfl")) return "nfl";
  if (s.includes("nhl") || s.includes("hockey")) return "nhl";
  if (s.includes("ncaaf") || s.includes("football_ncaa")) return "cfb";
  if (s.includes("ncaab") || s.includes("basketball_ncaa")) return "cbb";
  return "default";
}

function sportLabel(raw) {
  const map = {mlb:"MLB",nba:"NBA",nfl:"NFL",nhl:"NHL",cfb:"CFB",cbb:"CBB"};
  return map[sportKey(raw)] || raw || "\u2014";
}

function fmtOdds(v) { const n=Number(v); return isNaN(n)?String(v):n>0?"+"+n:String(n); }
function fmtPct(v) { const n=Number(v); return isNaN(n)?"\u2014":n.toFixed(2)+"%"; }
function fmtDecimalAsPct(v) { const n=Number(v); return isNaN(n)?"\u2014":(n*100).toFixed(2)+"%"; }
function gameName(g) { return g?(g.away_team||"Away")+" @ "+(g.home_team||"Home"):"\u2014"; }
function isProps(mt) { return mt && mt.startsWith("player_"); }
function propLabel(mt) { return mt?mt.replace("player_","").replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase()):mt; }

function setStatus(ok, text) {
  document.getElementById("status-dot").className = ok?"dot":"dot error";
  document.getElementById("status-text").textContent = text;
}

function getFiltered() {
  const sportF = document.getElementById("filter-sport").value;
  const bookF = document.getElementById("filter-book").value;
  const marketF = document.getElementById("filter-market").value;
  const evF = Number(document.getElementById("filter-ev").value) || 0;
  const searchF = document.getElementById("filter-search").value.toLowerCase().trim();

  return allOpps.filter(o => {
    const g = o.games || {};
    const ev = Number(o.ev_percentage) || 0;
    if (ev < evF) return false;
    if (sportF && (g.sport||"") !== sportF) return false;
    if (bookF && (o.sportsbook||"") !== bookF) return false;
    if (marketF === "game" && isProps(o.market_type)) return false;
    if (marketF === "props" && !isProps(o.market_type)) return false;
    if (marketF && marketF !== "game" && marketF !== "props" && o.market_type !== marketF) return false;
    if (searchF) {
      const haystack = ((g.home_team||"")+" "+(g.away_team||"")+" "+(o.side||"")).toLowerCase();
      if (!haystack.includes(searchF)) return false;
    }
    return true;
  });
}

function populateFilters() {
  const sports = new Map();
  const books = new Map();
  allOpps.forEach(o => {
    const g = o.games || {};
    const sp = g.sport || "";
    if (sp) sports.set(sp, (sports.get(sp)||0)+1);
    const bk = o.sportsbook || "";
    if (bk) books.set(bk, (books.get(bk)||0)+1);
  });

  const sportSel = document.getElementById("filter-sport");
  const cur = sportSel.value;
  sportSel.innerHTML = '<option value="">All Sports ('+allOpps.length+')</option>';
  [...sports.entries()].sort((a,b)=>b[1]-a[1]).forEach(([k,c])=>{
    sportSel.innerHTML += `<option value="${k}">${sportLabel(k)} (${c})</option>`;
  });
  sportSel.value = cur;

  const bookSel = document.getElementById("filter-book");
  const curB = bookSel.value;
  bookSel.innerHTML = '<option value="">All Books ('+allOpps.length+')</option>';
  [...books.entries()].sort((a,b)=>b[1]-a[1]).forEach(([k,c])=>{
    bookSel.innerHTML += `<option value="${k}">${k} (${c})</option>`;
  });
  bookSel.value = curB;
}

function updateStats(filtered) {
  const propCount = filtered.filter(o=>isProps(o.market_type)).length;
  document.getElementById("stat-count").textContent = filtered.length;
  document.getElementById("stat-props").textContent = propCount;
  if (!filtered.length) {
    document.getElementById("stat-best-ev").textContent = "\u2014";
    document.getElementById("stat-avg-ev").textContent = "\u2014";
    return;
  }
  const evs = filtered.map(o=>Number(o.ev_percentage)||0);
  document.getElementById("stat-best-ev").textContent = Math.max(...evs).toFixed(2)+"%";
  document.getElementById("stat-avg-ev").textContent = (evs.reduce((a,b)=>a+b,0)/evs.length).toFixed(2)+"%";
}

function renderTable(opps) {
  const tbody = document.getElementById("table-body");
  if (!opps.length) {
    tbody.innerHTML = '<tr><td colspan="9" class="message">No opportunities match your filters.</td></tr>';
    return;
  }
  tbody.innerHTML = opps.map(o => {
    const g = o.games || {};
    const sk = sportKey(g.sport);
    const ev = Number(o.ev_percentage) || 0;
    const evClass = ev >= 5 ? "ev-green" : "ev-yellow";
    const isProp = isProps(o.market_type);
    const marketDisplay = isProp
      ? `<span class="prop-tag">${propLabel(o.market_type)}</span>`
      : (o.market_type || "\u2014");
    return `<tr>
      <td><span class="sport-badge sport-${sk}">${sportLabel(g.sport)}</span></td>
      <td>${gameName(g)}</td>
      <td class="side">${o.side || "\u2014"}</td>
      <td class="market">${marketDisplay}</td>
      <td class="sportsbook">${o.sportsbook || "\u2014"}</td>
      <td class="odds">${fmtOdds(o.book_odds)}</td>
      <td class="prob">${fmtDecimalAsPct(o.true_prob)}</td>
      <td class="${evClass}">${fmtPct(o.ev_percentage)}</td>
      <td class="kelly">${fmtDecimalAsPct(o.kelly_fraction)}</td>
    </tr>`;
  }).join("");
}

function applyFilters() {
  const filtered = getFiltered();
  filtered.sort((a,b)=>(Number(b.ev_percentage)||0)-(Number(a.ev_percentage)||0));
  renderTable(filtered);
  updateStats(filtered);
}

async function fetchData() {
  try {
    const res = await fetch(API_URL);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    allOpps = data.opportunities || [];
    allOpps.sort((a,b)=>(Number(b.ev_percentage)||0)-(Number(a.ev_percentage)||0));
    populateFilters();
    applyFilters();
    setStatus(true, "Live \u00b7 updated " + new Date().toLocaleTimeString());
  } catch (e) {
    setStatus(false, "Error: " + e.message);
    document.getElementById("table-body").innerHTML =
      '<tr><td colspan="9" class="message error">Failed to fetch data. Is the API running at localhost:8000?</td></tr>';
  }
  countdown = REFRESH_INTERVAL;
}

// Wire up filter change events.
["filter-sport","filter-book","filter-market","filter-ev"].forEach(id=>{
  document.getElementById(id).addEventListener("change", applyFilters);
});
document.getElementById("filter-search").addEventListener("input", applyFilters);

function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    countdown--;
    document.getElementById("refresh-timer").textContent = "refresh in " + countdown + "s";
    if (countdown <= 0) fetchData();
  }, 1000);
}

fetchData();
startTimer();
</script>
</body>
</html>
