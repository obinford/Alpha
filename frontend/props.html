<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTM Picks — Player Props</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{
    background:#0a0e17;color:#c8cdd6;
    font-family:'SF Mono','Fira Code','Cascadia Code',Consolas,monospace;
    font-size:13px;line-height:1.5;
  }
  a{color:#42a5f5;text-decoration:none}
  a:hover{text-decoration:underline}
  .container{max-width:1400px;margin:0 auto;padding:16px 24px}

  /* Nav */
  nav{
    display:flex;gap:24px;padding:8px 0;border-bottom:1px solid #1a2035;margin-bottom:16px;
    font-size:12px;text-transform:uppercase;letter-spacing:1.5px;
  }
  nav a{color:#5a6378;padding:4px 0;border-bottom:2px solid transparent}
  nav a:hover{color:#c8cdd6;text-decoration:none}
  nav a.active{color:#00e676;border-bottom-color:#00e676}

  /* Header */
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 0;border-bottom:1px solid #1a2035;margin-bottom:16px;
  }
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand h1{font-size:20px;font-weight:700;color:#e1e5eb;letter-spacing:1px}
  .brand h1 span{color:#00e676}
  .brand .tagline{font-size:11px;color:#5a6378;text-transform:uppercase;letter-spacing:2px}
  .status-bar{display:flex;align-items:center;gap:16px;font-size:11px;color:#5a6378}
  .status-bar .dot{
    width:7px;height:7px;border-radius:50%;display:inline-block;
    background:#00e676;box-shadow:0 0 6px #00e67680;
  }
  .status-bar .dot.error{background:#ff5252;box-shadow:0 0 6px #ff525280}
  .status-bar .count{color:#8892a4}

  /* Filters */
  .filters{
    display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:center;
  }
  .filters select,.filters input{
    background:#111827;border:1px solid #1a2035;border-radius:4px;
    color:#c8cdd6;padding:6px 10px;font-family:inherit;font-size:12px;
  }
  .filters select:focus,.filters input:focus{outline:none;border-color:#42a5f5}
  .filters label{font-size:11px;color:#5a6378;text-transform:uppercase;letter-spacing:1px}

  /* Summary chips */
  .summary-chips{
    display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;
  }
  .chip{
    background:#111827;border:1px solid #1a2035;border-radius:16px;
    padding:4px 14px;font-size:12px;color:#8892a4;
    display:flex;align-items:center;gap:6px;
  }
  .chip .count{color:#00e676;font-weight:700}

  /* Player groups */
  .player-group{
    background:#111827;border:1px solid #1a2035;border-radius:6px;
    margin-bottom:12px;overflow:hidden;
  }
  .player-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 16px;background:#0d1420;cursor:pointer;
    border-bottom:1px solid #1a2035;
  }
  .player-header:hover{background:#131b2e}
  .player-name{font-size:14px;font-weight:700;color:#e1e5eb}
  .player-game{font-size:11px;color:#5a6378;margin-left:12px}
  .player-count{
    background:#1a2035;border-radius:10px;padding:2px 10px;
    font-size:11px;color:#00e676;font-weight:700;
  }
  .player-props{padding:0}
  .player-group.collapsed .player-props{display:none}

  /* Table */
  table{width:100%;border-collapse:collapse}
  th{
    text-align:left;padding:8px 14px;font-size:11px;color:#5a6378;
    text-transform:uppercase;letter-spacing:1px;font-weight:600;
    border-bottom:1px solid #1a2035;background:#0d1420;
  }
  td{padding:8px 14px;border-bottom:1px solid #0d1420}
  tr:hover{background:#151e30}

  .ev-val{font-weight:700}
  .ev-high{color:#00e676}
  .ev-medium{color:#ffc107}
  .ev-low{color:#8892a4}
  .odds-val{color:#e1e5eb;font-weight:600}
  .over{color:#42a5f5}
  .under{color:#ef5350}
  .kelly-val{color:#ba68c8}

  .sport-badge{
    display:inline-block;padding:2px 8px;border-radius:3px;
    font-size:10px;font-weight:700;text-transform:uppercase;
    letter-spacing:0.5px;
  }
  .sport-mlb{background:#4caf5020;color:#4caf50;border:1px solid #4caf5040}
  .sport-nba{background:#5c6bc020;color:#5c6bc0;border:1px solid #5c6bc040}
  .sport-nfl{background:#a1887f20;color:#a1887f;border:1px solid #a1887f40}
  .sport-nhl{background:#4dd0e120;color:#4dd0e1;border:1px solid #4dd0e140}
  .sport-cfb{background:#ffb74d20;color:#ffb74d;border:1px solid #ffb74d40}
  .sport-cbb{background:#ba68c820;color:#ba68c8;border:1px solid #ba68c840}

  /* Flat table view */
  .view-toggle{
    display:flex;gap:0;margin-left:auto;
  }
  .view-toggle button{
    background:#111827;border:1px solid #1a2035;color:#5a6378;
    padding:5px 14px;font-family:inherit;font-size:11px;cursor:pointer;
    text-transform:uppercase;letter-spacing:1px;
  }
  .view-toggle button:first-child{border-radius:4px 0 0 4px}
  .view-toggle button:last-child{border-radius:0 4px 4px 0}
  .view-toggle button.active{background:#1a2035;color:#00e676;border-color:#00e676}

  /* Time & new-line badges */
  .badge-new{
    display:inline-block;padding:2px 6px;border-radius:3px;font-size:9px;
    font-weight:700;letter-spacing:0.5px;text-transform:uppercase;
    background:#00e67618;color:#00e676;border:1px solid #00e67640;
    animation:pulse-new 2s ease-in-out infinite;margin-left:6px;
  }
  @keyframes pulse-new{0%,100%{opacity:1}50%{opacity:0.65}}
  .badge-time{
    display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;
    font-weight:600;color:#8892a4;
  }
  .badge-live{background:#ff525220;color:#ff5252;border:1px solid #ff525240}
  .badge-soon{background:#ffc10720;color:#ffc107;border:1px solid #ffc10740}

  .time-group-header{
    padding:8px 16px;font-size:11px;font-weight:700;letter-spacing:1.5px;
    text-transform:uppercase;color:#5a6378;background:#0a0e17;
    border-bottom:1px solid #1a2035;margin-top:12px;
  }
  .time-group-header:first-child{margin-top:0}

  .new-lines-stat{
    display:flex;align-items:center;gap:6px;padding:4px 14px;
    background:#00e67610;border:1px solid #00e67630;border-radius:16px;
    font-size:12px;color:#00e676;font-weight:700;
  }

  /* Loading */
  .message{text-align:center;padding:40px 20px;color:#5a6378}
  .message.error{color:#ff5252}
  .spinner{
    width:28px;height:28px;border:3px solid #1a2035;border-top-color:#00e676;
    border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  @media(max-width:900px){
    .container{padding:10px 12px}
    .filters{flex-direction:column}
    th:nth-child(n+8),td:nth-child(n+8){display:none}
  }
</style>
</head>
<body>
<div class="container">
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="signal.html">Signal</a>
    <a href="sharp-tracker.html">Sharp Tracker</a>
    <a href="props.html" class="active">Props</a>
    <a href="odds-screen.html">Odds Screen</a>
    <a href="performance.html">Performance</a>
    <a href="clv-report.html">CLV Report</a>
    <a href="daily-recap.html">Daily Recap</a>
    <a href="bankroll.html">Bankroll</a>
  </nav>

  <header>
    <div class="brand">
      <h1>RTM <span>PICKS</span></h1>
      <span class="tagline">Player Props Scanner</span>
    </div>
    <div class="status-bar">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">Connecting...</span>
      <span class="count" id="prop-count">—</span>
      <span id="refresh-timer"></span>
    </div>
  </header>

  <!-- Filters -->
  <div class="filters">
    <div>
      <label>Sport</label><br>
      <select id="filter-sport">
        <option value="">All Sports</option>
        <option value="baseball_mlb">MLB</option>
        <option value="basketball_nba">NBA</option>
        <option value="americanfootball_nfl">NFL</option>
        <option value="icehockey_nhl">NHL</option>
        <option value="americanfootball_ncaaf">CFB</option>
        <option value="basketball_ncaab">CBB</option>
      </select>
    </div>
    <div>
      <label>Prop Type</label><br>
      <select id="filter-type">
        <option value="">All Types</option>
        <option value="player_points">Points</option>
        <option value="player_rebounds">Rebounds</option>
        <option value="player_assists">Assists</option>
        <option value="player_threes">Threes</option>
        <option value="player_blocks">Blocks</option>
        <option value="player_steals">Steals</option>
        <option value="player_points_rebounds_assists">PRA</option>
        <option value="player_pass_tds">Pass TDs</option>
        <option value="player_pass_yds">Pass Yds</option>
        <option value="player_rush_yds">Rush Yds</option>
        <option value="player_receptions">Receptions</option>
        <option value="player_reception_yds">Rec Yds</option>
        <option value="player_anytime_td">Anytime TD</option>
      </select>
    </div>
    <div>
      <label>Player</label><br>
      <input type="text" id="filter-player" placeholder="Search player..." style="width:160px">
    </div>
    <div>
      <label>Sportsbook</label><br>
      <select id="filter-book">
        <option value="">All Books</option>
      </select>
    </div>
    <div>
      <label>Min EV%</label><br>
      <select id="filter-ev">
        <option value="">Any</option>
        <option value="3">3%+</option>
        <option value="5" selected>5%+</option>
        <option value="7">7%+</option>
        <option value="10">10%+</option>
      </select>
    </div>
    <div>
      <label>Time Window</label><br>
      <select id="filter-time">
        <option value="">All Games</option>
        <option value="soon">Starting Soon (&lt;3h)</option>
        <option value="today">Today</option>
        <option value="new">New Lines Only</option>
      </select>
    </div>
    <div class="view-toggle">
      <button id="view-grouped" class="active" onclick="setView('grouped')">Grouped</button>
      <button id="view-flat" onclick="setView('flat')">Flat</button>
    </div>
  </div>

  <!-- Summary chips -->
  <div class="summary-chips" id="chips"></div>

  <!-- Props content -->
  <div id="props-content">
    <div class="message"><div class="spinner"></div>Loading player props...</div>
  </div>
</div>

<script>
const API = window.location.origin + "/api";
const REFRESH = 60;
let countdown = REFRESH;
let timerInterval;
let currentView = "grouped";
let allProps = [];

function sportKey(s) {
  s = (s || "").toLowerCase();
  if (s.includes("mlb") || s.includes("baseball")) return "mlb";
  if (s.includes("basketball_nba") || (s.includes("nba") && !s.includes("ncaa"))) return "nba";
  if (s.includes("nfl") || s.includes("football_nfl")) return "nfl";
  if (s.includes("nhl") || s.includes("hockey")) return "nhl";
  if (s.includes("ncaaf") || s.includes("football_ncaa")) return "cfb";
  if (s.includes("ncaab") || s.includes("basketball_ncaa")) return "cbb";
  return "default";
}

function sportLabel(raw) {
  const map = {mlb:"MLB",nba:"NBA",nfl:"NFL",nhl:"NHL",cfb:"CFB",cbb:"CBB"};
  return map[sportKey(raw)] || raw || "\u2014";
}

function fmtOdds(v) {
  const n = Number(v);
  if (isNaN(n)) return String(v);
  return n > 0 ? "+" + n : String(n);
}

function fmtEv(v) {
  const n = Number(v);
  if (isNaN(n)) return "\u2014";
  return (n > 0 ? "+" : "") + n.toFixed(2) + "%";
}

function evClass(v) {
  const n = Number(v);
  if (n >= 7) return "ev-high";
  if (n >= 4) return "ev-medium";
  return "ev-low";
}

function fmtProb(v) {
  const n = Number(v);
  return isNaN(n) ? "\u2014" : (n * 100).toFixed(1) + "%";
}

// --- Time helpers ---
function getHoursUntil(p) {
  const ct = p.commence_time || p.start_time;
  if (!ct) return null;
  const d = new Date(ct);
  if (isNaN(d)) return null;
  return (d - Date.now()) / 3600000;
}
function fmtStarts(p) {
  const h = getHoursUntil(p);
  if (h === null) return '';
  if (h < 0) return '<span class="badge-time badge-live">LIVE</span>';
  if (h < 1) return `<span class="badge-time badge-soon">${Math.round(h*60)}m</span>`;
  if (h < 6) return `<span class="badge-time badge-soon">${h.toFixed(1)}h</span>`;
  const d = new Date(p.commence_time || p.start_time);
  return `<span class="badge-time">${d.toLocaleDateString('en-US',{weekday:'short',hour:'numeric',minute:'2-digit'})}</span>`;
}
function newBadge(p) {
  return p.is_new_line ? '<span class="badge-new">NEW</span>' : '';
}
function timeGroup(p) {
  const h = getHoursUntil(p);
  if (h === null) return 'UNKNOWN';
  if (h < 0) return 'LIVE NOW';
  if (h < 3) return 'STARTING SOON';
  if (h < 12) return 'TODAY';
  return 'LATER';
}

function setStatus(ok, text) {
  document.getElementById("status-dot").className = ok ? "dot" : "dot error";
  document.getElementById("status-text").textContent = text;
}

function setView(v) {
  currentView = v;
  document.getElementById("view-grouped").className = v === "grouped" ? "active" : "";
  document.getElementById("view-flat").className = v === "flat" ? "active" : "";
  renderProps(allProps);
}

function renderChips(byType) {
  const container = document.getElementById("chips");
  if (!byType || !Object.keys(byType).length) {
    container.innerHTML = "";
    return;
  }
  container.innerHTML = Object.entries(byType)
    .sort((a, b) => b[1] - a[1])
    .map(([type, count]) => `<div class="chip"><span class="count">${count}</span> ${type}</div>`)
    .join("");
}

function renderPropRow(p) {
  const sk = sportKey(p.sport);
  const dir = (p.direction || "").toLowerCase();
  const dirClass = dir === "over" ? "over" : dir === "under" ? "under" : "";

  return `<tr>
    <td>${fmtStarts(p)}</td>
    <td><span class="sport-badge sport-${sk}">${sportLabel(p.sport)}</span></td>
    <td style="color:#e1e5eb;font-weight:600">${p.player || "\u2014"}${newBadge(p)}</td>
    <td>${p.prop_label || p.prop_type || "\u2014"}</td>
    <td class="${dirClass}">${p.direction || "\u2014"} ${p.line != null ? p.line : ""}</td>
    <td>${p.sportsbook || "\u2014"}</td>
    <td class="odds-val">${fmtOdds(p.odds)}</td>
    <td class="ev-val ${evClass(p.ev_pct)}">${fmtEv(p.ev_pct)}</td>
    <td>${fmtProb(p.true_prob)}</td>
    <td class="kelly-val">${p.kelly != null ? (p.kelly * 100).toFixed(1) + "%" : "\u2014"}</td>
    <td style="font-size:11px;color:#5a6378">${p.game || "\u2014"}</td>
  </tr>`;
}

function renderGroupedView(props) {
  // Group by player
  const groups = {};
  props.forEach(p => {
    const name = p.player || "Unknown";
    if (!groups[name]) groups[name] = { props: [], game: p.game, sport: p.sport };
    groups[name].props.push(p);
  });

  // Sort by number of props (most first), then alphabetically.
  const sorted = Object.entries(groups)
    .sort((a, b) => b[1].props.length - a[1].props.length || a[0].localeCompare(b[0]));

  if (!sorted.length) {
    return '<div class="message">No player props found with current filters. Try lowering the EV threshold or broadening your search.</div>';
  }

  return sorted.map(([name, data]) => {
    const sk = sportKey(data.sport);
    const bestEv = Math.max(...data.props.map(p => Number(p.ev_pct) || 0));
    const hasNew = data.props.some(p => p.is_new_line);
    const gameTime = fmtStarts(data.props[0]);
    return `
    <div class="player-group">
      <div class="player-header" onclick="this.parentElement.classList.toggle('collapsed')">
        <div>
          <span class="sport-badge sport-${sk}">${sportLabel(data.sport)}</span>
          <span class="player-name" style="margin-left:10px">${name}</span>${hasNew ? '<span class="badge-new">NEW</span>' : ''}
          <span class="player-game">${data.game || ""}${gameTime ? ' — '+gameTime : ''}</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <span class="ev-val ${evClass(bestEv)}">${fmtEv(bestEv)} best</span>
          <span class="player-count">${data.props.length} prop${data.props.length > 1 ? "s" : ""}</span>
        </div>
      </div>
      <div class="player-props">
        <table>
          <thead><tr>
            <th>Starts</th><th>Sport</th><th>Player</th><th>Prop</th><th>Line</th>
            <th>Book</th><th>Odds</th><th>EV%</th><th>True Prob</th>
            <th>Kelly</th><th>Game</th>
          </tr></thead>
          <tbody>${data.props.map(renderPropRow).join("")}</tbody>
        </table>
      </div>
    </div>`;
  }).join("");
}

function renderFlatView(props) {
  if (!props.length) {
    return '<div class="message">No player props found with current filters.</div>';
  }

  return `
  <div style="background:#111827;border:1px solid #1a2035;border-radius:6px;overflow:hidden">
    <table>
      <thead><tr>
        <th>Sport</th><th>Player</th><th>Prop</th><th>Line</th>
        <th>Book</th><th>Odds</th><th>EV%</th><th>True Prob</th>
        <th>Kelly</th><th>Game</th>
      </tr></thead>
      <tbody>${props.map(renderPropRow).join("")}</tbody>
    </table>
  </div>`;
}

function renderProps(props) {
  const container = document.getElementById("props-content");
  if (currentView === "grouped") {
    container.innerHTML = renderGroupedView(props);
  } else {
    container.innerHTML = renderFlatView(props);
  }
}

function populateBookFilter(props) {
  const sel = document.getElementById("filter-book");
  const cur = sel.value;
  const books = new Set();
  props.forEach(p => { if (p.sportsbook) books.add(p.sportsbook); });
  sel.innerHTML = '<option value="">All Books</option>';
  [...books].sort().forEach(b => {
    sel.innerHTML += `<option value="${b}">${b}</option>`;
  });
  sel.value = cur;
}

function getQueryParams() {
  const params = new URLSearchParams();
  const sport = document.getElementById("filter-sport").value;
  const type = document.getElementById("filter-type").value;
  const player = document.getElementById("filter-player").value.trim();
  const book = document.getElementById("filter-book").value;
  const ev = document.getElementById("filter-ev").value;

  if (sport) params.set("sport", sport);
  if (type) params.set("prop_type", type);
  if (player) params.set("player", player);
  if (book) params.set("sportsbook", book);
  if (ev) params.set("min_ev", ev);

  const qs = params.toString();
  return qs ? "?" + qs : "";
}

function applyTimeFilter(props) {
  const tw = document.getElementById("filter-time").value;
  if (!tw) return props;
  return props.filter(p => {
    const h = getHoursUntil(p);
    if (tw === "new") return p.is_new_line;
    if (tw === "soon") return h !== null && h >= -1 && h < 3;
    if (tw === "today") return h !== null && h >= -1 && h < 18;
    return true;
  });
}

let playerTimeout;
async function fetchData() {
  const qp = getQueryParams();
  try {
    const res = await fetch(API + "/props/" + qp);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();

    const rawProps = data.props || [];
    allProps = applyTimeFilter(rawProps);
    const newCount = rawProps.filter(p => p.is_new_line).length;

    document.getElementById("prop-count").textContent = allProps.length + " props";

    // Render chips with new-lines stat
    const chipsData = data.by_type || {};
    renderChips(chipsData);
    const chipsEl = document.getElementById("chips");
    if (newCount > 0) {
      chipsEl.innerHTML = `<div class="new-lines-stat">⚡ ${newCount} NEW LINE${newCount > 1 ? 'S' : ''}</div>` + chipsEl.innerHTML;
    }

    populateBookFilter(allProps);
    renderProps(allProps);

    const now = new Date().toLocaleTimeString();
    setStatus(true, "Live \u00b7 " + now);
  } catch (e) {
    setStatus(false, "Error: " + e.message);
    document.getElementById("props-content").innerHTML =
      '<div class="message error">Failed to fetch props. Is the API running?</div>';
  }
  countdown = REFRESH;
}

// Filter change handlers.
["filter-sport", "filter-type", "filter-book", "filter-ev", "filter-time"].forEach(id => {
  document.getElementById(id).addEventListener("change", fetchData);
});

// Debounced player search.
document.getElementById("filter-player").addEventListener("input", () => {
  clearTimeout(playerTimeout);
  playerTimeout = setTimeout(fetchData, 400);
});

function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    countdown--;
    document.getElementById("refresh-timer").textContent = "refresh in " + countdown + "s";
    if (countdown <= 0) fetchData();
  }, 1000);
}

fetchData();
startTimer();
</script>
</body>
</html>
